# Publica o site no GitHub Pages a cada envio para main.
# Sem etapa de construção: o que está no repositório é o que é servido.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Envios em sequência esperam, em vez de
# cancelar a publicação que já começou.
concurrency:
  group: pages
  cancel-in-progress: false

# DOIS JOBS, e não um, desde 22/11/2026. Empacotar e publicar estavam no
# mesmo job, um passo colado no outro, e a publicação falhava de vez em
# quando com "No artifacts named github-pages were found for this workflow
# run" — logo depois de o passo anterior dizer que o artefato subiu.
#
# A causa é uma corrida: a lista de artefatos do GitHub leva um instante
# para ficar consistente, e o deploy-pages consultava antes da hora. Dava
# para ver nos tempos. Em 21/11/2026 as execuções levaram 17, 18 e 18
# segundos e passaram; em 22/11/2026, às 04:10 e às 04:14, levaram 13
# segundos e falharam. Quanto mais rápida a execução, maior a chance.
#
# A fronteira entre dois jobs resolve, e é o desenho do modelo oficial do
# GitHub Pages, que sempre separou build de deploy. O segundo job espera o
# primeiro terminar por inteiro, e o artefato já está registrado quando ele
# começa.
#
# Efeito colateral bom: re-executar passou a ser seguro. Com um job só,
# `gh run rerun --failed` refazia o upload e a execução ficava com DOIS
# artefatos de mesmo nome, o que quebrava de outro jeito. Agora o job que
# falha é o de publicar, que não empacota nada.
jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      # O que vai ao ar é só o site. Este passo age na cópia do runner, nunca
      # no repositório: o modelo de artigo, a documentação e os arquivos de
      # configuração continuam versionados e continuam aqui.
      #
      # Por que cada um sai:
      #   artigos/_template.html  é servido com os marcadores crus à vista
      #   LEIA-ME.md              documentação interna, servida como texto
      #   PROCEDENCIA.md          idem, com os resumos SHA-256 de cada ativo
      #   .gitignore              configuração, sem uso para quem visita
      #   .gitattributes          idem
      #   .claude                 pasta de trabalho local
      #   ferramentas             programas de apoio, em Python. Nenhum deles
      #                           roda no servidor: o site é estático. Servido,
      #                           um .py é entregue como texto, de graça, a
      #                           quem quiser ler como a publicação funciona.
      #
      # A pasta .github fica FORA da lista, de propósito. Medido em
      # 16/11/2026: /.github/workflows/publicar.yml já responde 404, ou seja,
      # nunca esteve no pacote. Apagá-la não tiraria nada do ar e mexeria,
      # durante a execução, na pasta que define a própria execução. Risco sem
      # contrapartida.
      #
      # O CNAME fica, e não é descuido: sem ele cada publicação apaga o
      # domínio personalizado configurado no painel.
      - name: Tirar do pacote o que não é site
        run: |
          rm -f  artigos/_template.html
          rm -f  ./*.md
          rm -f  .gitignore .gitattributes
          rm -rf .claude ferramentas
          echo "Sobrou para publicar:"
          ls -A

      - name: Empacotar a raiz do repositório
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
